# =============================================================================
# Reachy Mini Conversation — conda environment definition
# =============================================================================
# 创建:conda env create -f environment.yml
# 激活:conda activate reachy
# 启动:./scripts/start.sh
#
# 注意(路径 A 策略):
#   系统原生依赖(cairo / gstreamer / ffmpeg / gtk 等)走 apt,
#   见 scripts/install_deps.sh。environment.yml 只装 Python 包,
#   避免 apt 和 conda 两套版本冲突。
#
# 仅 macOS / 无 sudo 环境需要 conda-forge 装 cairo 等。
# =============================================================================
name: reachy

channels:
  - conda-forge
  - defaults

dependencies:
  # ---------- Python 解释器 ----------
  - python=3.12
  - pip

  # ---------- 纯 Python 包(conda-forge 优先,比 pip 稳)----------
  # 决策 6/13 变更(2025-09-09):numpy>=2.2.5(reachy_mini 要求)
  - numpy>=2.2.5
  - scipy
  - soundfile
  - python-dotenv

  # ---------- 走 pip(mediapipe / av conda 版本滞后)----------
  # 决策 6/13 变更(2025-09-09):移除 funasr,详见 agents.local.md §9
  - pip:
      # SDK
      - "reachy-mini>=1.10.0"
      - reachy-mini-dances-library

      # Web 框架
      - gradio>=4.0
      - fastapi
      - uvicorn[standard]

      # LLM / ASR / TTS
      # 豆包 LLM:ark.cn-beijing.volces.com/api/v3
      # 豆包 ASR:WebSocket 流式,openspeech.bytedance.com
      - edge-tts
      - httpx
      - websockets

      # 手部跟随(P6 启用)
      - mediapipe

      # 视频/音频解码
      - av>=10.0

      # 开发工具
      - pytest
      - black
      - ruff
